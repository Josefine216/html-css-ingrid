<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css"> 
</head>

<body>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <input type="checkbox" id="cart-toggle" class="cart-toggle">

    <header class="main-header">

        <!--Top rectangle-->
        <div class="header-top">
            <div class="left-column">
                <label for="menu-toggle" class="hamburger" tabindex="0" role="button" aria-label="Open menu">☰</label>
                
                <div class="logo">
                    <a href="index.html">
                        <img src="images/logo.png" width="125" alt="RainyDays Logo">
                    </a>
                </div>
            </div>

            <!--right column-->
            <div class="right-column">
                <a href="#" class="desktop-search-icon">
                    <span class="sr-only">Search</span>🔍
                </a>
                <a href="login.html" class="desktop-my-site-icon">
                    <span class="sr-only">Go to </span>👤 My site
                </a>
                <label for="cart-toggle" class="desktop-cart-icon" tabindex="0" role="button" aria-label="Open shopping cart">🛒</label>   
            </div>
        </div>

        <!--Bottom rectangle-->
        <nav class="navbar" aria-label="Main navigation">
            <label for="menu-toggle" class="close-menu" tabindex="0" role="button" aria-label="Close menu">✕</label>

        <div class="mobile-menu-actions">
            <div class="mobile-search-wrapper">
                <span class="search-field-icon" aria-hidden="true">🔍</span>
                <label for="mobile-search" class="sr-only">Search here</label>
                <input type="search" class="mobile-search-input" id="mobile-search" placeholder="Search here...">
            </div>
            <a href="login.html" class="mobile-action-item">👤 My site</a>
        </div>

            <h3>CATEGORIES:</h3>
            <ul>
                <li><a href="/men">Men</a></li>
                <li><a href="/women">Women</a></li>
                <li><a href="/collections">Collections</a></li>
                <li><a href="/outlet">Outlet</a></li>
                <li><a href="/info">Info</a></li>
            </ul>
        </nav>

    </header>

</body>
